<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF8B6B"/>
      <stop offset="100%" stop-color="#E85F2C"/>
    </linearGradient>
    <!-- Clip everything to the rounded tile so the flag bands at the
         bottom follow the rounded corners cleanly. -->
    <clipPath id="tile">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Orange→red gradient background -->
    <rect width="32" height="32" fill="url(#bg)"/>

    <!-- Big chunky white G, centred slightly above middle. -->
    <text
      x="16" y="19.5"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="22"
      fill="white">G</text>

    <!-- German flag — three vertical bands across the bottom 15% of the
         tile, black / red / yellow from left to right. -->
    <rect x="0"     y="27.5" width="10.67" height="4.5" fill="#000000"/>
    <rect x="10.67" y="27.5" width="10.67" height="4.5" fill="#DD0000"/>
    <rect x="21.33" y="27.5" width="10.67" height="4.5" fill="#FFCE00"/>
  </g>
</svg>
