name: Daily article generation

# Generates 3 new articles per day from scripts/out/article-plan.json:
# Opus 4.8 source → all-locale translations (per locale policy) → FLUX hero
# image → insert into Supabase. Idempotent via translations._meta.slug, so a
# re-run never duplicates. Runs on GitHub's servers — no local machine needed.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:        # allow manual runs from the Actions tab
    inputs:
      count:
        description: 'How many articles to generate this run'
        required: false
        default: '3'

concurrency:
  group: daily-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm install (not ci) so a package-lock drift between npm versions
      # doesn't break this utility job. Only needs the supabase/anthropic/
      # replicate clients, which are in package.json.
      - run: npm install --no-audit --no-fund

      - name: Generate articles
        env:
          ARTICLE_GEN_ANTHROPIC_KEY: ${{ secrets.ARTICLE_GEN_ANTHROPIC_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-articles-run.mjs --daily=${{ github.event.inputs.count || '3' }}
